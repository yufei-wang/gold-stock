<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>券商月度金股总结</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #f5f7fa; color: #333; }
        .header { background: linear-gradient(135deg, #1a237e 0%, #283593 100%); color: white; padding: 24px 32px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
        .header h1 { font-size: 24px; font-weight: 600; }
        .header p { opacity: .8; margin-top: 4px; font-size: 14px; }
        .controls { display: flex; gap: 16px; align-items: center; padding: 16px 32px; background: white; border-bottom: 1px solid #e0e0e0; flex-wrap: wrap; }
        .controls label { font-size: 14px; color: #666; }
        .controls select, .controls input { padding: 6px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
        .filter-btn { padding: 5px 12px; border: 1px solid #ddd; background: white; border-radius: 14px; cursor: pointer; font-size: 12px; transition: all .2s; }
        .filter-btn.active { background: #1a237e; color: white; border-color: #1a237e; }
        .filter-btn:hover { border-color: #1a237e; }
        .container { max-width: 1600px; margin: 0 auto; padding: 24px; }
        .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
        .chart-box { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        .chart-box h3 { font-size: 15px; margin-bottom: 8px; color: #444; }
        .table-box { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow-x: auto; }
        .table-box h3 { font-size: 15px; margin-bottom: 12px; color: #444; display: flex; align-items: center; gap: 12px; }
        .table-box h3 .count { font-size: 13px; color: #888; font-weight: normal; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #f0f2f5; padding: 10px 8px; text-align: left; font-weight: 600; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
        td { padding: 9px 8px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
        tr:hover td { background: #f8f9ff; }
        .col-rank { width: 36px; text-align: center; color: #999; }
        .col-name { font-weight: 600; white-space: nowrap; }
        .col-count { text-align: center; font-weight: 700; font-size: 15px; color: #1a237e; }
        .col-change { text-align: center; }
        .col-reason { max-width: 420px; font-size: 12px; line-height: 1.5; color: #555; }
        .col-reason .reason-item { margin-bottom: 4px; padding-left: 8px; border-left: 2px solid #e0e0e0; }
        .col-reason .reason-item:last-child { margin-bottom: 0; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 500; }
        .badge-up { background: #e8f5e9; color: #2e7d32; }
        .badge-down { background: #fce4ec; color: #c62828; }
        .badge-new { background: #e3f2fd; color: #1565c0; }
        .badge-same { background: #f5f5f5; color: #757575; }
        .search-input { min-width: 220px; }
        .expand-btn { cursor: pointer; color: #1a237e; font-size: 11px; margin-left: 4px; }
        .expand-btn:hover { text-decoration: underline; }
        @media (max-width: 768px) {
            .chart-row { grid-template-columns: 1fr; }
            .controls { padding: 12px 16px; }
            .container { padding: 16px; }
            .col-reason { max-width: 260px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>南方基金 · 券商月度金股总结</h1>
        <p id="dataMeta">推荐次数 · 月度变化 · 至今涨幅一站式查看</p>
    </div>

    <div class="controls">
        <label>月份:</label>
        <select id="monthSelect"></select>

        <label>筛选:</label>
        <select id="changeFilter">
            <option value="all">全部</option>
            <option value="new">新增</option>
            <option value="up">推荐增加</option>
            <option value="down">推荐减少</option>
            <option value="multi">多次推荐(≥2)</option>
        </select>

        <label>搜索:</label>
        <input type="text" id="searchInput" class="search-input" placeholder="股票名称/代码/行业/券商...">
    </div>

    <div class="container">
        <!-- 图表 -->
        <div class="chart-row">
            <div class="chart-box">
                <h3>推荐次数TOP15</h3>
                <div id="chartTop" style="width:100%;height:340px;"></div>
            </div>
            <div class="chart-box">
                <h3>与上月对比变化</h3>
                <div id="chartChange" style="width:100%;height:340px;"></div>
            </div>
        </div>

        <!-- 数据表格 -->
        <div class="table-box">
            <h3 id="tableTitle">金股总结 <span class="count" id="tableCount"></span></h3>
            <div style="max-height:700px;overflow-y:auto;">
                <table>
                    <thead>
                        <tr>
                            <th class="col-rank">#</th>
                            <th>行业</th>
                            <th>代码</th>
                            <th>名称</th>
                            <th class="sortable" data-sort="count" style="text-align:center;cursor:pointer;user-select:none;" title="点击排序">推荐次数 <span class="sort-arrow"></span></th>
                            <th class="sortable" data-sort="change" style="text-align:center;cursor:pointer;user-select:none;" title="点击排序">较上月 <span class="sort-arrow"></span></th>
                            <th class="sortable" data-sort="change_pct" style="text-align:center;cursor:pointer;user-select:none;" title="点击按涨幅排序 · 当月首日基准价至最新收盘">至今涨幅 <span class="sort-arrow"></span></th>
                            <th>券商/分析师</th>
                            <th>推荐理由</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
    (function() {
        const data = GOLD_STOCK_DATA;
        let currentMonth = data.months[data.months.length - 1] || '';
        let changeFilter = 'all';
        let searchText = '';
        let sortField = null;  // 'count' | 'change' | 'change_pct' | null
        let sortDir = 'desc';  // 'asc' | 'desc'

        // 显示数据更新时间
        if (data.prices_meta && data.prices_meta.latest_date) {
            const d = data.prices_meta.latest_date;
            const fmt = `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`;
            document.getElementById('dataMeta').textContent = `股价数据截至 ${fmt} | 数据更新: ${data.prices_meta.generated_at || ''}`;
        }

        // 排序点击
        document.querySelectorAll('th.sortable').forEach(th => {
            th.addEventListener('click', () => {
                const field = th.dataset.sort;
                if (sortField === field) {
                    sortDir = sortDir === 'desc' ? 'asc' : 'desc';
                } else {
                    sortField = field;
                    sortDir = 'desc';
                }
                updateSortArrows();
                render();
            });
        });

        function updateSortArrows() {
            document.querySelectorAll('th.sortable').forEach(th => {
                const arrow = th.querySelector('.sort-arrow');
                if (th.dataset.sort === sortField) {
                    arrow.textContent = sortDir === 'desc' ? '▼' : '▲';
                    arrow.style.color = '#1a237e';
                } else {
                    arrow.textContent = '⇅';
                    arrow.style.color = '#ccc';
                }
            });
        }
        updateSortArrows();

        // 月份选择器
        const monthSelect = document.getElementById('monthSelect');
        data.months.slice().reverse().forEach(m => {
            const opt = document.createElement('option');
            opt.value = m;
            opt.textContent = m.replace('-', '年') + '月';
            monthSelect.appendChild(opt);
        });

        // 事件
        monthSelect.addEventListener('change', () => { currentMonth = monthSelect.value; render(); });
        document.getElementById('changeFilter').addEventListener('change', e => { changeFilter = e.target.value; render(); });
        document.getElementById('searchInput').addEventListener('input', e => { searchText = e.target.value.toLowerCase(); render(); });

        function getFiltered() {
            let records = data.summary[currentMonth] || [];

            // 搜索
            if (searchText) {
                records = records.filter(r =>
                    (r.name||'').toLowerCase().includes(searchText) ||
                    (r.code||'').toLowerCase().includes(searchText) ||
                    (r.industry||'').toLowerCase().includes(searchText) ||
                    (r.analysts||'').toLowerCase().includes(searchText)
                );
            }

            // 筛选
            if (changeFilter === 'new') {
                records = records.filter(r => r.change === '新增');
            } else if (changeFilter === 'up') {
                records = records.filter(r => { const n = parseInt(r.change); return !isNaN(n) && n > 0; });
            } else if (changeFilter === 'down') {
                records = records.filter(r => { const n = parseInt(r.change); return !isNaN(n) && n < 0; });
            } else if (changeFilter === 'multi') {
                records = records.filter(r => r.count >= 2);
            }

            // 排序
            if (sortField) {
                const dir = sortDir === 'desc' ? -1 : 1;
                records = records.slice().sort((a, b) => {
                    let va, vb;
                    if (sortField === 'count') {
                        va = a.count || 0; vb = b.count || 0;
                    } else if (sortField === 'change') {
                        // 新增 => 视为极大值，null/'' 视为极小
                        const parseChg = v => {
                            if (v === '新增') return 999;
                            const n = parseInt(v);
                            return isNaN(n) ? -999 : n;
                        };
                        va = parseChg(a.change); vb = parseChg(b.change);
                    } else if (sortField === 'change_pct') {
                        // null 值排在最后
                        const na = a.change_pct === null || a.change_pct === undefined;
                        const nb = b.change_pct === null || b.change_pct === undefined;
                        if (na && nb) return 0;
                        if (na) return 1;
                        if (nb) return -1;
                        va = a.change_pct; vb = b.change_pct;
                    }
                    if (va < vb) return -1 * dir;
                    if (va > vb) return 1 * dir;
                    return 0;
                });
            }

            return records;
        }

        function render() {
            const allRecords = data.summary[currentMonth] || [];
            const filtered = getFiltered();

            document.getElementById('tableCount').textContent = `共 ${filtered.length} 条${filtered.length !== allRecords.length ? ` / 全部 ${allRecords.length} 条` : ''}`;

            renderTable(filtered);
            renderTopChart(allRecords);
            renderChangeChart(allRecords);
        }

        function renderTable(records) {
            const REASON_LIMIT = 80;
            document.getElementById('tableBody').innerHTML = records.map((r, i) => {
                // 推荐理由处理：按 | 分条，每条截断
                let reasonHtml = '-';
                if (r.reason) {
                    const parts = r.reason.split(' | ').filter(Boolean);
                    reasonHtml = parts.map(p => {
                        const display = p.length > REASON_LIMIT ? p.slice(0, REASON_LIMIT) + '...' : p;
                        return `<div class="reason-item" title="${escHtml(p)}">${escHtml(display)}</div>`;
                    }).join('');
                }

                // 涨幅列
                let priceHtml = '<span style="color:#bbb;">-</span>';
                if (r.change_pct !== null && r.change_pct !== undefined) {
                    const pct = r.change_pct;
                    const color = pct > 0 ? '#c62828' : (pct < 0 ? '#2e7d32' : '#666');
                    const sign = pct > 0 ? '+' : '';
                    const baseDate = r.base_date ? `${r.base_date.slice(0,4)}-${r.base_date.slice(4,6)}-${r.base_date.slice(6,8)}` : '';
                    const tooltip = `基准价(${baseDate}): ${r.base_price} ${r.currency}\n最新价: ${r.latest_price} ${r.currency}`;
                    priceHtml = `<span style="color:${color};font-weight:600;" title="${escHtml(tooltip)}">${sign}${pct.toFixed(2)}%</span>`;
                }

                return `<tr>
                    <td class="col-rank">${i+1}</td>
                    <td>${r.industry}</td>
                    <td style="white-space:nowrap;">${r.code}</td>
                    <td class="col-name">${r.name}</td>
                    <td class="col-count">${r.count}</td>
                    <td class="col-change">${changeBadge(r.change)}</td>
                    <td style="text-align:center;white-space:nowrap;">${priceHtml}</td>
                    <td style="font-size:12px;max-width:200px;white-space:normal;">${r.analysts}</td>
                    <td class="col-reason">${reasonHtml}</td>
                </tr>`;
            }).join('');
        }

        function escHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function changeBadge(val) {
            if (val === '新增') return '<span class="badge badge-new">新增</span>';
            const num = parseInt(val);
            if (isNaN(num)) return `<span class="badge badge-same">${val || '-'}</span>`;
            if (num > 0) return `<span class="badge badge-up">↑${num}</span>`;
            if (num < 0) return `<span class="badge badge-down">↓${Math.abs(num)}</span>`;
            return '<span class="badge badge-same">持平</span>';
        }

        function renderTopChart(records) {
            const sorted = [...records].sort((a,b) => b.count - a.count).slice(0, 15).reverse();
            const chart = echarts.init(document.getElementById('chartTop'));
            chart.setOption({
                tooltip: { trigger: 'axis', formatter: p => `${p[0].name}: ${p[0].value}次推荐` },
                grid: { left: 100, right: 30, top: 10, bottom: 20 },
                xAxis: { type: 'value', minInterval: 1 },
                yAxis: { type: 'category', data: sorted.map(r => r.name), axisLabel: { fontSize: 11 } },
                series: [{
                    type: 'bar', data: sorted.map(r => r.count),
                    itemStyle: { color: new echarts.graphic.LinearGradient(0,0,1,0, [{offset:0,color:'#42a5f5'},{offset:1,color:'#1a237e'}]) },
                    barWidth: 18,
                    label: { show: true, position: 'right', fontSize: 11, color: '#333' }
                }]
            });
            window.addEventListener('resize', () => chart.resize());
        }

        function renderChangeChart(records) {
            // 统计变化分布
            let newCount = 0, upCount = 0, downCount = 0, sameCount = 0;
            records.forEach(r => {
                if (r.change === '新增') { newCount++; return; }
                const n = parseInt(r.change);
                if (isNaN(n)) return;
                if (n > 0) upCount++;
                else if (n < 0) downCount++;
                else sameCount++;
            });

            const chart = echarts.init(document.getElementById('chartChange'));
            chart.setOption({
                tooltip: { trigger: 'item', formatter: '{b}: {c}只 ({d}%)' },
                legend: { bottom: 0, textStyle: { fontSize: 12 } },
                series: [{
                    type: 'pie', radius: ['35%', '65%'], center: ['50%', '45%'],
                    data: [
                        { name: '新增', value: newCount, itemStyle: { color: '#1565c0' } },
                        { name: '推荐增加', value: upCount, itemStyle: { color: '#2e7d32' } },
                        { name: '持平', value: sameCount, itemStyle: { color: '#9e9e9e' } },
                        { name: '推荐减少', value: downCount, itemStyle: { color: '#c62828' } },
                    ].filter(d => d.value > 0),
                    label: { fontSize: 12, formatter: '{b}\n{c}只' },
                    emphasis: { itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,.2)' } }
                }]
            });
            window.addEventListener('resize', () => chart.resize());
        }

        render();
    })();
    </script>
</body>
</html>
